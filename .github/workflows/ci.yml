name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forwarding
          POSTGRES_USER: forwarding
          POSTGRES_PASSWORD: ci_only_password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U forwarding -d forwarding"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_PASSWORD: ci_only_password
      DB_INTEGRATION_TEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: bash mvnw -B verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
